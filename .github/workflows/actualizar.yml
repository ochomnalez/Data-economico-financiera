name: Actualizar datos del INDEC

on:
  schedule:
    # El INDEC publica a las 16:00 (hora argentina = UTC-3).
    - cron: "15 19 * * 1-5"   # 16:15 ART, días hábiles
    - cron: "45 21 * * 1-5"   # 18:45 ART, segunda pasada por si se demora
    - cron: "20 11 * * *"     # 08:20 ART, todos los días (dólar y revisiones)
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/actualizar.yml"]
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar notificación de prueba"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Descargar datos del INDEC
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: python pipeline/build.py

      - name: Guardar datos nuevos en el repositorio
        run: |
          git config user.name "pulso-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Si mientras corría se subió otro cambio a main, se integra antes de subir.
            for intento in 1 2 3; do
              git pull --rebase -X theirs -q origin main && git push && exit 0
              echo "Reintento $intento…"; sleep $((intento * 5))
            done
            exit 1
          fi

      - name: Notificar al teléfono
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: |
          python pipeline/notify.py
          if [ "${{ inputs.prueba }}" = "true" ]; then python pipeline/notify.py --prueba; fi

      - name: Avisar si el token del INDEC venció
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: python pipeline/notify.py --errores

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
